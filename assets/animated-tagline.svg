<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 40" width="100%" height="40">
  <style>
    :root {
      --text-color: #24292f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text-color: #f0f6fc;
      }
    }
    .tagline-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 18px;
      font-weight: 600;
      fill: var(--text-color);
      text-anchor: middle;
      dominant-baseline: middle;
      letter-spacing: 0.4px;
    }
    .item-1 { animation: anim-1 12.5s infinite; }
    .item-2 { animation: anim-2 12.5s infinite; }
    .item-3 { animation: anim-3 12.5s infinite; }
    .item-4 { animation: anim-4 12.5s infinite; }
    .item-5 { animation: anim-5 12.5s infinite; }

    @keyframes anim-1 {
      0% { opacity: 0; transform: translateY(4px); }
      2% { opacity: 1; transform: translateY(0px); }
      18% { opacity: 1; transform: translateY(0px); }
      20% { opacity: 0; transform: translateY(-4px); }
      100% { opacity: 0; }
    }
    @keyframes anim-2 {
      0%, 20% { opacity: 0; transform: translateY(4px); }
      22% { opacity: 1; transform: translateY(0px); }
      38% { opacity: 1; transform: translateY(0px); }
      40% { opacity: 0; transform: translateY(-4px); }
      100% { opacity: 0; }
    }
    @keyframes anim-3 {
      0%, 40% { opacity: 0; transform: translateY(4px); }
      42% { opacity: 1; transform: translateY(0px); }
      58% { opacity: 1; transform: translateY(0px); }
      60% { opacity: 0; transform: translateY(-4px); }
      100% { opacity: 0; }
    }
    @keyframes anim-4 {
      0%, 60% { opacity: 0; transform: translateY(4px); }
      62% { opacity: 1; transform: translateY(0px); }
      78% { opacity: 1; transform: translateY(0px); }
      80% { opacity: 0; transform: translateY(-4px); }
      100% { opacity: 0; }
    }
    @keyframes anim-5 {
      0%, 80% { opacity: 0; transform: translateY(4px); }
      82% { opacity: 1; transform: translateY(0px); }
      98% { opacity: 1; transform: translateY(0px); }
      100% { opacity: 0; transform: translateY(-4px); }
    }
  </style>

  <g transform="translate(300, 20)">
    <text class="tagline-text item-1" x="0" y="0">Physics × Computation</text>
    <text class="tagline-text item-2" x="0" y="0">General Relativity</text>
    <text class="tagline-text item-3" x="0" y="0">Quantum Gravity</text>
    <text class="tagline-text item-4" x="0" y="0">Constrained Dynamics</text>
    <text class="tagline-text item-5" x="0" y="0">Symbolic Computing</text>
  </g>
</svg>
